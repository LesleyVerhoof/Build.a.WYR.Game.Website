<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learn how to build a Would You Rather game with HTML, CSS, and JavaScript for fun decision-making scenarios.">
  <meta name="keywords" content="would you rather, web development, HTML, CSS, JavaScript, tutorial, game">
  <meta name="author" content="Your Name">
  <title>Would You Rather Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Would You Rather Game</h1>
    <div id="question" class="question">Eat This or That</div>
    <div>
      <img src="./image/waffle.jpg">
    </div>
    <div class="options">
      <button id="option1" class="option-btn" disabled>Waffles</button>
      <button id="option2" class="option-btn" disabled>Pancakes</button>
    </div>
    <button id="newQuestion" class="new-question">Next</button>
    <div id="result" class="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
